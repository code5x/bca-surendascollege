<script>
    (function () {
      const THEME_COLORS = { light: "#ffffff", dark: "#1a1a2e" };
      const saved = localStorage.getItem("userThemePreference");
      const system = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark" : "light";
      const theme = saved || system;

      // Apply data-theme immediately
      document.documentElement.setAttribute("data-theme", theme);

      // Update meta theme-color immediately
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = THEME_COLORS[theme];
    })();
  </script>

<script>
(function () {
  const STORAGE_KEY = "userThemePreference";
  const THEME_COLORS = {
    light: "#ffffff",
    dark:  "#1a1a2e"
  };
  function getSystemTheme() {
    return window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark"
      : "light";
  }
  function getSavedTheme() {
    return localStorage.getItem(STORAGE_KEY) || getSystemTheme();
  }
  function updateMetaThemeColor(theme) {
    let metaTag = document.querySelector('meta[name="theme-color"]');
    if (!metaTag) {
      metaTag = document.createElement("meta");
      metaTag.name = "theme-color";
      document.head.appendChild(metaTag);
    }
    metaTag.content = THEME_COLORS[theme];
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    updateMetaThemeColor(theme);
    const checkbox = document.getElementById("themeCheckbox");
    if (checkbox) {
      checkbox.checked = theme === "dark";
    }
  }
  function setTheme(theme) {
    localStorage.setItem(STORAGE_KEY, theme);
    applyTheme(theme);
  }
  function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    setTheme(current === "dark" ? "light" : "dark");
  }
  function watchSystemTheme() {
    window.matchMedia("(prefers-color-scheme: dark)")
      .addEventListener("change", (e) => {
        if (!localStorage.getItem(STORAGE_KEY)) {
          applyTheme(e.matches ? "dark" : "light");
        }
      });
  }
  function watchStorageChanges() {
    window.addEventListener("storage", (e) => {
      if (e.key === STORAGE_KEY && e.newValue) {
        applyTheme(e.newValue);
      }
    });
  }
  if (document.head) {
    applyTheme(getSavedTheme());
  }
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", () => {
    applyTheme(getSavedTheme());
    const checkbox = document.getElementById("themeCheckbox");
    if (checkbox) {
      checkbox.addEventListener("change", toggleTheme);
    }
  });
} else {
  applyTheme(getSavedTheme());
  const checkbox = document.getElementById("themeCheckbox");
  if (checkbox) {
    checkbox.addEventListener("change", toggleTheme);
  }
}
  watchSystemTheme();
  watchStorageChanges();
})();

</script>
