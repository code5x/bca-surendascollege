<script>
    (function () {
      const THEME_COLORS = { light: "#ffffff", dark: "#1a1a2e" };
      const saved = localStorage.getItem("userThemePreference");
      const system = window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark" : "light";
      const theme = saved || system;

      // Apply data-theme immediately
      document.documentElement.setAttribute("data-theme", theme);

      // Update meta theme-color immediately
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = THEME_COLORS[theme];
    })();
  </script>

</head>

<script>
(function () {
  const STORAGE_KEY = "userThemePreference";
  const THEME_COLORS = {
    light: "#ffffff",
    dark:  "#1a1a2e"
  };
  function getSystemTheme() {
    return window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark"
      : "light";
  }
  function getSavedTheme() {
    return localStorage.getItem(STORAGE_KEY) || getSystemTheme();
  }
  function updateMetaThemeColor(theme) {
    let metaTag = document.querySelector('meta[name="theme-color"]');
    if (!metaTag) {
      metaTag = document.createElement("meta");
      metaTag.name = "theme-color";
      document.head.appendChild(metaTag);
    }
    metaTag.content = THEME_COLORS[theme];
  }
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    updateMetaThemeColor(theme);
    const checkbox = document.getElementById("themeCheckbox");
    if (checkbox) {
      checkbox.checked = theme === "dark";
    }
  }
  function setTheme(theme) {
    localStorage.setItem(STORAGE_KEY, theme);
    applyTheme(theme);
  }
  function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    setTheme(current === "dark" ? "light" : "dark");
  }
  function watchSystemTheme() {
    window.matchMedia("(prefers-color-scheme: dark)")
      .addEventListener("change", (e) => {
        if (!localStorage.getItem(STORAGE_KEY)) {
          applyTheme(e.matches ? "dark" : "light");
        }
      });
  }
  function watchStorageChanges() {
    window.addEventListener("storage", (e) => {
      if (e.key === STORAGE_KEY && e.newValue) {
        applyTheme(e.newValue);
      }
    });
  }
  if (document.head) {
    applyTheme(getSavedTheme());
  }
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", () => {
    applyTheme(getSavedTheme());
    const checkbox = document.getElementById("themeCheckbox");
    if (checkbox) {
      checkbox.addEventListener("change", toggleTheme);
    }
  });
} else {
  applyTheme(getSavedTheme());
  const checkbox = document.getElementById("themeCheckbox");
  if (checkbox) {
    checkbox.addEventListener("change", toggleTheme);
  }
}
  watchSystemTheme();
  watchStorageChanges();
})();


function openMenu(){
    document.getElementById("sideMenu").classList.add("active");
    document.getElementById("headOverlay").classList.add("show");
}
function closeMenu(){
    document.getElementById("sideMenu").classList.remove("active");
    document.getElementById("headOverlay").classList.remove("show");
}
function toggleUploads(){
    document.getElementById("uploadsMenu").classList.toggle("show");
}
function toggleAbout(){
    document.getElementById("aboutMenu").classList.toggle("show");
}
document.querySelectorAll('.side-menu a').forEach(link => {
    link.addEventListener('click', () => {
        closeMenu();
    });
});
window.addEventListener('pageshow', () => {
    closeMenu();
});
</script>

<script>
async function loadBookDetails() {
  const params = new URLSearchParams(window.location.search);
  const url = params.get("url");
  const loadingEl = document.getElementById("loading");
  const metaEl = document.getElementById("bookMeta");
  const titleEl = document.getElementById("bookTitle");
  const holdingsTable = document.getElementById("holdingsTable");
  const tbody = holdingsTable.querySelector("tbody");
  const downloadBtn = document.getElementById("downloadBtn");

function showLoading(message) {
  if (!loadingEl) return;
  loadingEl.textContent = message || '';
  const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  loadingEl.style.color = isDark ? '#fc3838' : '#b30707';
}

  if(!url) {
    showLoading('No book URL provided.');
    return;
  }

  try {
    const res = await fetch(`/api/bookdetails?url=${encodeURIComponent(url)}`);
    const data = await res.json();

    if(!data.success) {
      showLoading('Failed to fetch book details. Refresh the page to see again.');
      return;
    }

    const b = data.book;
    titleEl.textContent = b.title || "Untitled";

document.getElementById("shareBtn").addEventListener("click", async (event) => {
  event.preventDefault(); // stop the link from reloading page
  if (navigator.share) {
    try {
      const shareUrl = `${location.origin}/share-book?url=` + encodeURIComponent(url);
      await navigator.share({
        title: b.title,
        text: " ",
        url: shareUrl
      });
      console.log("Page shared successfully!");
    } catch (err) {
      console.error("Share failed:", err.message);
    }
   } else {
    alert("Sharing not supported in this browser.");
  }
});

const details = [
  ["Title", b.title],
  ["Author", b.author ? `<a href="library-opac-browse.html?type=author&query=${encodeURIComponent(b.author)}" 
    class="link-style" >${b.author}</a>` : ""],
  ["Edition", b.edition],
  ["ISBN", b.isbn],
  ["Place & Publisher", (() => {
      if (!b.publisher) return "";
      const parts = b.publisher.split(/[,;]+/).map(x => x.trim()).filter(Boolean);
      if (parts.length === 1) {
        const pub = parts[0];
        return `<a href="library-opac-browse.html?type=publisher&query=${encodeURIComponent(pub)}"
                  class="link-style" >${pub}</a>`;
      } else {
        const place = parts[0];
        const publisher = parts.slice(1).join(", ");
        return `
          <a href="library-opac-browse.html?type=place&query=${encodeURIComponent(place)}"
             class="link-style" >${place}</a>,
          <a href="library-opac-browse.html?type=publisher&query=${encodeURIComponent(publisher)}"
             class="link-style" >${publisher}</a>`;
      }
  })()],
  ["Date of Publication", b.year ? `<a href="library-opac-browse.html?type=year&query=${encodeURIComponent(b.year)}" 
      class="link-style" >${b.year}</a>` : ""],
  ["Pages", b.pages],
  ["Subject Descriptors", b.subjects
    ? b.subjects.split(/[,;]+/).map(s => 
        `<a href="library-opac-browse.html?type=subject&query=${encodeURIComponent(s.trim())}" 
           class="link-style" >${s.trim()}</a>`).join(", ")
    : ""],
  ["Language", b.language],
  ["Class No.", b.classNo],
  ["Catalogue Agency", b.catalogue]

    ].filter(row => row[1] && row[1].trim() !== "");

    if(details.length) {
      const table = document.createElement("table");
      let html = "<tbody>";
      for(const [k,v] of details) {
        html += `<tr><td style="width:30%;font-weight:500;">${k}</td><td>${v}</td></tr>`;
      }
      html += "</tbody>";
      table.innerHTML = html;
      metaEl.appendChild(table);
    }

    if(Array.isArray(b.holdings) && b.holdings.length){
      tbody.innerHTML = b.holdings.map(h =>
        `<tr>
          <td>${h.copyNo||""}</td>
          <td>${h.accession||""}</td>
          <td>${h.shelving||""}</td>
        </tr>`
      ).join("");
      holdingsTable.style.display="table";
    } else {
      holdingsTable.style.display="none";
    }

    loadingEl.style.display="none";
  } catch(err) {
    showLoading(`Error: ${err.message}`);
  }
}

window.addEventListener("load", loadBookDetails);

</script>
